services:

  postgres:
    image: postgres:16-alpine
    container_name: mindmetrics-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: mindmetrics
      POSTGRES_USER: mindmetrics
      POSTGRES_PASSWORD: change_me

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U mindmetrics -d mindmetrics"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: